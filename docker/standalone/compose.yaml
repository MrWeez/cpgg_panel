services:
  ctrlpanel:
    image: ghcr.io/ctrlpanel-gg/panel:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9010:80"
    environment:
      DB_HOST: mariadb
      DB_DATABASE: "${CTRLPANEL_DB_DATABASE}"
      DB_USERNAME: "${CTRLPANEL_DB_USER}"
      DB_PASSWORD: "${CTRLPANEL_DB_PASSWORD}"
      REDIS_HOST: redis
      TRUSTED_PROXIES: "${CTRLPANEL_TRUSTED_PROXIES}"
    volumes:
      - './panel.env:/var/www/html/.env'
      - './storage:/var/www/html/storage'
      # - './panel:/var/www/html:rw' # full project access for addons/plugins
      # - './nginx:/etc/nginx/conf.d/:rw' # custom nginx, dangerous to edit
    networks:
      - ctrlpanel

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    networks:
      - ctrlpanel
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - ctrlpanel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ctrlpanel:

volumes:
  mariadb-data:
